[project]
name = "agent-platform"
version = "0.1.0"
description = "Agent Platform - A dual-role agent development platform based on AgentScope."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # AgentScope core + service extras (FastAPI, uvicorn, apscheduler, ag-ui)
    "agentscope[service]>=2.0.6",
    # Redis storage backend
    "agentscope[storage-redis]>=2.0.6",
    # Qdrant vector store for knowledge base
    "agentscope[vdb-qdrant]>=2.0.6",
    # Channel adapters (Feishu, Discord)
    "agentscope[channel]>=2.0.6",
    # Additional dependencies not in agentscope extras
    "PyJWT>=2.8.0",
    "passlib[bcrypt]>=1.7.4",
    "shortuuid>=1.0.0",
    # Centralized configuration loading from .env
    "pydantic-settings>=2.0.0",
    # Token / permission cache with TTL eviction
    "cachetools>=5.3.0",
    # Structured logging
    "structlog>=24.0.0",
    # HTTP client for OAuth2.0 password grant delegation
    "httpx>=0.27.0",
    # Database ORM + drivers (SQLAlchemy with async support)
    # Dev: SQLite via aiosqlite (zero setup); Prod: PostgreSQL via asyncpg
    "SQLAlchemy[asyncio]>=2.0.0",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.29.0",
    # OAuth2 form data parsing (FastAPI OAuth2PasswordRequestForm)
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pre-commit",
    "pytest",
    "pytest-asyncio",
]
sandbox-docker = [
    "docker>=7.0.0",
]
sandbox-k8s = [
    "kubernetes>=29.0.0",
]

[tool.uv]
index-url = "https://pypi.tuna.tsinghua.edu.cn/simple"

[build-system]
requires = ["setuptools>=45"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
